  <text x="380" y="150" font-family="sans-serif" font-size="11" fill="#0369a1"><tspan font-weight="bold">जारी दिनांक:</tspan> 10/02/2026</text>

  <text x="60" y="190" font-family="sans-serif" font-size="12" fill="#334155">प्रमाणित किया जाता है कि <tspan font-weight="bold" fill="#0f172a">श्रीमती/श्री अनीता शर्मा (ANITA SHARMA)</tspan></text>
  <text x="60" y="214" font-family="sans-serif" font-size="12" fill="#334155">पिता/पति: <tspan font-weight="600">श्री आर. शर्मा</tspan>, पता: मकान नं. 12, गांधी मार्ग, तहसील - नमूना</text>

  <rect x="60" y="235" width="480" height="50" rx="6" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1" />
  <text x="80" y="256" font-family="sans-serif" font-size="12" font-weight="600" fill="#0369a1">निवास की स्थिति (Resident Status):</text>
  <text x="80" y="274" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0284c7">संबंधित राज्य के स्थायी मूल निवासी (Permanent Resident)</text>

  <text x="60" y="315" font-family="sans-serif" font-size="11" fill="#64748b">यह प्रमाण पत्र राज्य लोक सेवा गारंटी पोर्टल (EDistrict) द्वारा जनरेट किया गया है।</text>

  <!-- Digital Signature -->
