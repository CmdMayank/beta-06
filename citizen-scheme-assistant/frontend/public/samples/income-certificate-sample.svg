<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <rect width="600" height="420" fill="#f8fafc" />
  
  <!-- Certificate Border -->
  <rect x="25" y="35" width="550" height="365" rx="8" fill="#fffefb" stroke="#cbd5e1" stroke-width="2" />
  <rect x="33" y="43" width="534" height="349" rx="4" fill="none" stroke="#d97706" stroke-width="1.2" stroke-opacity="0.4" />

  <!-- Header -->
  <text x="300" y="72" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e293b">राज्य शासन / GOVERNMENT OF STATE</text>
  <text x="300" y="90" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#b45309">राजस्व विभाग / REVENUE DEPARTMENT</text>
  <text x="300" y="115" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-decoration="underline">आय प्रमाण पत्र / INCOME CERTIFICATE</text>

  <!-- Meta Info Bar -->
  <rect x="50" y="130" width="500" height="32" rx="6" fill="#f1f5f9" />
  <text x="65" y="151" font-family="sans-serif" font-size="11" fill="#475569"><tspan font-weight="bold">प्रमाण पत्र क्र. / Cert No:</tspan> INC/2026/XXXX982</text>
  <text x="380" y="151" font-family="sans-serif" font-size="11" fill="#475569"><tspan font-weight="bold">दिनांक / Date:</tspan> 15/01/2026</text>

  <!-- Body Content -->
  <text x="60" y="190" font-family="sans-serif" font-size="12" fill="#334155">प्रमाणित किया जाता है कि <tspan font-weight="bold" fill="#0f172a">श्रीमती/श्री अनीता शर्मा (ANITA SHARMA)</tspan></text>
  <text x="60" y="212" font-family="sans-serif" font-size="12" fill="#334155">आत्मज/पत्नी: <tspan font-weight="600">श्री आर. शर्मा</tspan>, निवासी: ग्राम/वार्ड - आदर्श नगर, तहसील - नमूना</text>
  
  <rect x="60" y="232" width="480" height="48" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
  <text x="80" y="252" font-family="sans-serif" font-size="12" font-weight="500" fill="#065f46">समस्त स्रोतों से परिवार की कुल वार्षिक आय:</text>
  <text x="80" y="271" font-family="sans-serif" font-size="14" font-weight="bold" fill="#047857">₹ 1,20,000/- (एक लाख बीस हजार रुपये मात्र)</text>

  <text x="60" y="305" font-family="sans-serif" font-size="11" fill="#64748b">वैधता अवधि: वित्तीय वर्ष 2026-2027 (जारी दिनांक से 3 वर्ष अथवा राज्य नियमानुसार)</text>

  <!-- Signature / Seal Placeholder -->
  <g transform="translate(380, 318)">
    <circle cx="65" cy="38" r="32" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2" stroke-dasharray="3,2" />
    <text x="65" y="35" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="bold" fill="#1d4ed8">DIGITALLY SIGNED</text>
    <text x="65" y="47" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#1e40af">तहसीलदार / TEHSILDAR</text>
    <text x="65" y="58" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#60a5fa">(SPECIMEN SECTOR)</text>
  </g>

  
    <rect x="0" y="0" width="600" height="24" fill="#fef2f2" />
    <text x="300" y="16" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#b91c1c" letter-spacing="1">
      FICTIONAL SPECIMEN ONLY • NOT A VALID OFFICIAL DOCUMENT • केवल उदाहरणार्थ नमूना
    </text>
  
  
    <!-- Prominent Watermark Overlay -->
    <g transform="translate(300, 200) rotate(-25)">
      <rect x="-240" y="-45" width="480" height="90" rx="12" fill="#ef4444" fill-opacity="0.12" stroke="#ef4444" stroke-opacity="0.35" stroke-dasharray="6,4" stroke-width="2" />
      <text x="0" y="-8" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="900" fill="#dc2626" fill-opacity="0.55" letter-spacing="3">SAMPLE – NOT VALID</text>
      <text x="0" y="26" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#dc2626" fill-opacity="0.55">केवल नमूना - अमान्य</text>
    </g>
  
</svg>