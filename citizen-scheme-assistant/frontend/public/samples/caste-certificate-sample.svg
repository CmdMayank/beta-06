<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <rect width="600" height="420" fill="#f8fafc" />
  
  <!-- Outer Frame -->
  <rect x="25" y="35" width="550" height="365" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
  <rect x="33" y="43" width="534" height="349" rx="4" fill="none" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.35" />

  <!-- Header -->
  <text x="300" y="70" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e293b">कार्यालय अनुविभागीय अधिकारी (राजस्व) / OFFICE OF SDO</text>
  <text x="300" y="88" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#4f46e5">DEPARTMENT OF SOCIAL JUSTICE & REVENUE</text>
  <text x="300" y="114" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-decoration="underline">जाति प्रमाण पत्र / CASTE CERTIFICATE</text>

  <!-- Numbering -->
  <rect x="50" y="130" width="500" height="30" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <text x="65" y="150" font-family="sans-serif" font-size="11" fill="#475569"><tspan font-weight="bold">प्रमाण पत्र संख्या:</tspan> CST/2026/XXXX451</text>
  <text x="380" y="150" font-family="sans-serif" font-size="11" fill="#475569"><tspan font-weight="bold">सत्यापन बारकोड:</tspan> 890123XXXX</text>

  <!-- Content -->
  <text x="60" y="188" font-family="sans-serif" font-size="12" fill="#334155">यह प्रमाणित किया जाता है कि <tspan font-weight="bold" fill="#0f172a">श्रीमती/श्री अनीता शर्मा (ANITA SHARMA)</tspan></text>
  <text x="60" y="210" font-family="sans-serif" font-size="12" fill="#334155">निवासी: जिला - भोपाल, राज्य - मध्य प्रदेश</text>
  
  <rect x="60" y="228" width="480" height="52" rx="6" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1" />
  <text x="80" y="250" font-family="sans-serif" font-size="12" font-weight="500" fill="#3730a3">मान्यता प्राप्त श्रेणी / Category:</text>
  <text x="80" y="269" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4338ca">अन्य पिछड़ा वर्ग (OBC) / SC / ST (Non-Creamy Layer Specimen)</text>

  <text x="60" y="306" font-family="sans-serif" font-size="11" fill="#64748b">नोट: यह प्रमाण पत्र डिजिटल हस्ताक्षरित है तथा ऑनलाइन सत्यापन योग्य है।</text>

  <!-- Stamp -->
  <g transform="translate(380, 318)">
    <rect width="130" height="52" rx="6" fill="#f1f5f9" stroke="#6366f1" stroke-width="1" />
    <text x="65" y="22" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#4338ca">अनुविभागीय अधिकारी (SDO)</text>
    <text x="65" y="36" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#6366f1">डिजिटल हस्ताक्षर (सत्यापित)</text>
    <text x="65" y="47" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#94a3b8">GOVERNMENT OF MP</text>
  </g>

  
    <rect x="0" y="0" width="600" height="24" fill="#fef2f2" />
    <text x="300" y="16" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#b91c1c" letter-spacing="1">
      FICTIONAL SPECIMEN ONLY • NOT A VALID OFFICIAL DOCUMENT • केवल उदाहरणार्थ नमूना
    </text>
  
  
    <!-- Prominent Watermark Overlay -->
    <g transform="translate(300, 200) rotate(-25)">
      <rect x="-240" y="-45" width="480" height="90" rx="12" fill="#ef4444" fill-opacity="0.12" stroke="#ef4444" stroke-opacity="0.35" stroke-dasharray="6,4" stroke-width="2" />
      <text x="0" y="-8" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="900" fill="#dc2626" fill-opacity="0.55" letter-spacing="3">SAMPLE – NOT VALID</text>
      <text x="0" y="26" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#dc2626" fill-opacity="0.55">केवल नमूना - अमान्य</text>
    </g>
  
</svg>