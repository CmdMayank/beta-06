<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <rect width="600" height="380" fill="#f8fafc" />
  
  <rect x="20" y="32" width="560" height="328" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  
  <!-- Passbook Header Bar -->
  <rect x="20" y="32" width="560" height="48" rx="14" fill="#1e3a8a" />
  <text x="300" y="53" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff">सार्वजनिक क्षेत्र बैंक / PUBLIC SECTOR BANK</text>
  <text x="300" y="69" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="500" fill="#bfdbfe">बचत बैंक खाता पासबुक / SAVINGS BANK PASSBOOK (SPECIMEN)</text>

  <!-- Passbook First Page Details -->
  <g transform="translate(45, 95)">
    <!-- Info Grid -->
    <rect width="510" height="175" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    
    <text x="20" y="28" font-family="sans-serif" font-size="11" fill="#64748b">खाताधारक का नाम / Name:</text>
    <text x="200" y="28" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">ANITA SHARMA / अनीता शर्मा</text>

    <line x1="15" y1="42" x2="495" y2="42" stroke="#e2e8f0" stroke-width="1" />

    <text x="20" y="64" font-family="sans-serif" font-size="11" fill="#64748b">खाता संख्या / Account No:</text>
    <text x="200" y="64" font-family="monospace" font-size="15" font-weight="bold" fill="#1e3a8a" letter-spacing="2">XXXXXXXXXXXX1234</text>

    <line x1="15" y1="78" x2="495" y2="78" stroke="#e2e8f0" stroke-width="1" />

    <text x="20" y="100" font-family="sans-serif" font-size="11" fill="#64748b">IFSC कोड / IFSC Code:</text>
    <text x="200" y="100" font-family="monospace" font-size="13" font-weight="bold" fill="#0f172a">SPEC0001234</text>

    <text x="340" y="100" font-family="sans-serif" font-size="11" fill="#64748b">शाखा / Branch:</text>
    <text x="420" y="100" font-family="sans-serif" font-size="12" font-weight="600" fill="#0f172a">Civil Lines</text>

    <line x1="15" y1="114" x2="495" y2="114" stroke="#e2e8f0" stroke-width="1" />

    <text x="20" y="136" font-family="sans-serif" font-size="11" fill="#64748b">DBT / Aadhaar Seeding:</text>
    <rect x="200" y="122" width="105" height="20" rx="10" fill="#dcfce7" />
    <text x="252" y="136" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#15803d">ACTIVE / सक्रिय</text>

    <line x1="15" y1="150" x2="495" y2="150" stroke="#e2e8f0" stroke-width="1" />

    <text x="20" y="166" font-family="sans-serif" font-size="10" fill="#94a3b8">MICR Code: 000000000 • Customer CIF: 9876543 • Single Operating Account</text>
  </g>

  <!-- Bank Stamp Specimen -->
  <g transform="translate(420, 280)">
    <circle cx="50" cy="35" r="28" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2" stroke-dasharray="3,2" />
    <text x="50" y="32" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="bold" fill="#1e40af">BANK BRANCH SEAL</text>
    <text x="50" y="44" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#3b82f6">(SPECIMEN STAMP)</text>
  </g>

  <!-- Note -->
  <text x="55" y="305" font-family="sans-serif" font-size="11" fill="#475569">
    ✓ सरकारी योजनाओं के सीधे लाभ (DBT) के लिए बैंक खाता आधार से लिंक व सक्रिय होना अनिवार्य है।
  </text>
  <text x="55" y="325" font-family="sans-serif" font-size="11" fill="#475569">
    ✓ पासबुक की पहली प्रति (First Page) स्पष्ट व पठनीय होनी चाहिए।
  </text>

  
    <rect x="0" y="0" width="600" height="24" fill="#fef2f2" />
    <text x="300" y="16" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#b91c1c" letter-spacing="1">
      FICTIONAL SPECIMEN ONLY • NOT A VALID OFFICIAL DOCUMENT • केवल उदाहरणार्थ नमूना
    </text>
  
  
    <!-- Prominent Watermark Overlay -->
    <g transform="translate(300, 200) rotate(-25)">
      <rect x="-240" y="-45" width="480" height="90" rx="12" fill="#ef4444" fill-opacity="0.12" stroke="#ef4444" stroke-opacity="0.35" stroke-dasharray="6,4" stroke-width="2" />
      <text x="0" y="-8" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="900" fill="#dc2626" fill-opacity="0.55" letter-spacing="3">SAMPLE – NOT VALID</text>
      <text x="0" y="26" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#dc2626" fill-opacity="0.55">केवल नमूना - अमान्य</text>
    </g>
  
</svg>